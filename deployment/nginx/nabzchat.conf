# ==============================================================
# Server 1: nabzchat.tech / www.nabzchat.tech -> Static coming-soon
# ==============================================================
server {
    server_name nabzchat.tech www.nabzchat.tech;
    root /var/www/nabzchat-soon;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Block all .env files
    location ~ /\.env {
        deny all;
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Basic cache headers for static assets
    location ~* \.(html)$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nabzchat.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nabzchat.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

# ==============================================================
# Server 2: app.nabzchat.tech -> React app (Node.js on port 3000)
# ==============================================================
server {
    server_name app.nabzchat.tech;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nabzchat.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nabzchat.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# ==============================================================
# Server 3: Catch-all default -> Drop unknown hostname requests
# ==============================================================
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    if ($host = www.nabzchat.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = nabzchat.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name nabzchat.tech www.nabzchat.tech;
    return 404; # managed by Certbot




}
server {
    if ($host = app.nabzchat.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name app.nabzchat.tech;
    return 404; # managed by Certbot


}