# ==============================================================
# Server 1: nabzchat.tech / www.nabzchat.tech -> Static coming-soon
# ==============================================================
server {
    listen 80;
    server_name nabzchat.tech www.nabzchat.tech;
    root /var/www/nabzchat-soon;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Basic cache headers for static assets
    location ~* \.(html)$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }
}

# ==============================================================
# Server 2: app.nabzchat.tech -> React app (Node.js on port 3000)
# ==============================================================
server {
    listen 80;
    server_name app.nabzchat.tech;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ==============================================================
# Server 3: Catch-all default -> Drop unknown hostname requests
# ==============================================================
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
