# ==============================================================
# Adminer database panel  hidden, password-protected
# ==============================================================
server {
    listen 80;
    server_name admin-x7k2m9.nabzchat.tech;

    # Default: deny everything on this subdomain
    location / {
        return 404;
    }

    # Adminer lives at obscure path
    location /db-admin-x7k2m9/ {
        # Basic Auth layer
        auth_basic "NabzChat Admin";
        auth_basic_user_file /etc/nginx/.nabzchat-adminer-auth;

        # Serve Adminer PHP file
        alias /var/www/adminer/;
        index adminer.php;

        # PHP-FPM handling
        location ~ \.php$ {
            auth_basic "NabzChat Admin";
            auth_basic_user_file /etc/nginx/.nabzchat-adminer-auth;

            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
            fastcgi_param SCRIPT_FILENAME /var/www/adminer/adminer.php;
        }

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
